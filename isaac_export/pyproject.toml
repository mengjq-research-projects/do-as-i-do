[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "do-as-i-do-isaac-export"
version = "0.1.0"
description = "Export Do as I Do retargeting results for Isaac Sim replay"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.13.2",
]

[project.scripts]
isaac-export = "isaac_export.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["isaac_export"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
